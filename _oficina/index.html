<title>Oficina MinuteMark</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap">
<style>
/* Oficina MinuteMark · herramienta interna de los socios (no es la landing).
   Colores, tipografía y reglas: Design System de MinuteMark. La marca se ve siempre en modo claro.
   Layout: las salas viven en una barra lateral en tinta (como el pie del landing); cada sala va sobre fondo;
   las bandas azules con Mark quedan solo para la llegada (Recepción) y la Reunión de las 6. */
:root{
  --azul-profundo:#0051B9;
  --azul-brillante:#008CFF;
  --azul-hover:#0067D6;
  --azul-tenue:#E8F1FF;
  --fondo:#F6F8FB;
  --superficie:#FFFFFF;
  --blanco:#FFFFFF;
  --carril:#EDF1F6;
  --gris:#EEEEEE;
  --gris-2:#E3E8EF;
  --linea:#DCE3EC;
  --tinta:#0A1B33;
  --tinta-suave:#54657F;
  --tinta-tenue:#7A8AA0;
  --sobre-azul:#FFFFFF;
  --sobre-azul-suave:#DCEBFF;
  --sobre-azul-acento:#BFE0FF;
  --sobre-azul-etiqueta:#9FCBFF;
  --borde-claro:rgba(255,255,255,.45);
  --lado-texto:#C6D8EE;
  --lado-tenue:#7FA6D4;
  --lado-hover:rgba(255,255,255,.06);
  --lado-activo:rgba(255,255,255,.12);
  --verde-abierto:#1FBF6A;
  --alerta:#B42318;
  --alerta-tenue:#FDEDEB;
  --velo:rgba(10,27,51,.45);
  --degradado:linear-gradient(118deg,#0051B9 0%,#0062D2 46%,#008CFF 100%);
  --sombra:0 1px 2px rgba(10,27,51,.05),0 12px 30px -18px rgba(10,27,51,.28);
  --sombra-modal:0 30px 80px -30px rgba(10,27,51,.55);
  --anillo:0 0 0 4px rgba(0,140,255,.14);
  --r-s:12px;
  --r-m:18px;
  --r-l:26px;
  --f:"Outfit","Poppins","Myriad Pro",Arial,sans-serif;
  color-scheme:light;
}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--fondo);color:var(--tinta);font-family:var(--f);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0;font-weight:600;letter-spacing:-.025em;line-height:1.08;text-wrap:balance}
p{margin:0}
ul,ol{margin:0;padding:0;list-style:none}
button,input,select,textarea{font:inherit;color:inherit}
img{max-width:100%}
:focus-visible{outline:3px solid var(--azul-brillante);outline-offset:2px;border-radius:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg{display:block}

.etiqueta{display:block;font-size:12px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--azul-profundo)}
.etiqueta-azul{color:var(--sobre-azul-etiqueta)}
.lead{color:var(--tinta-suave);font-size:17px;font-weight:300;max-width:62ch}
.vacio{color:var(--tinta-suave);font-weight:300;font-size:14px}
.panel-ayuda{color:var(--tinta-suave);font-weight:300;font-size:14px;max-width:60ch}

/* ---------- estructura ---------- */
.app{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100%}
.lado{
  position:sticky;top:0;height:100vh;height:100dvh;overflow-y:auto;z-index:20;
  background:var(--tinta);color:var(--lado-texto);
  display:flex;flex-direction:column;gap:24px;
  padding-block:24px;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:18px;
}
.lado-marca{display:flex;flex-direction:column;gap:6px;padding-left:10px}
.lado-logo{display:block;width:150px}
.lado-logo img{display:block;width:100%;height:auto}
.lado-sub{font-size:12px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--lado-tenue)}
.lado-nav{display:flex;flex-direction:column;gap:2px}
.sala-link{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;color:var(--lado-texto);text-decoration:none;font-size:15px;white-space:nowrap}
.sala-link svg{width:20px;height:20px;flex:none}
.sala-link:hover{background:var(--lado-hover)}
.sala-link.on{background:var(--lado-activo);color:var(--blanco);font-weight:500}
.cuenta{margin-left:auto;font-size:12px;font-weight:600;background:var(--lado-activo);color:var(--blanco);border-radius:999px;padding:1px 8px;font-variant-numeric:tabular-nums}
.vivo-dot{margin-left:auto}
.lado-pie{margin-top:auto;display:flex;flex-direction:column;gap:14px}
.lado-etq{display:block;font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--lado-tenue);margin-bottom:8px}
.presentes ul{display:flex;flex-direction:column;gap:8px}
.presentes li{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--blanco)}
.presentes small{display:block;font-size:12px;color:var(--lado-tenue)}
.presentes .av-wrap{position:relative}
.presentes .av-wrap::after{content:"";position:absolute;right:-2px;bottom:-2px;width:10px;height:10px;border-radius:50%;background:var(--verde-abierto);border:2px solid var(--tinta)}
.quien{display:flex;align-items:center;gap:10px;background:none;border:0;padding:8px;border-radius:12px;cursor:pointer;color:var(--blanco);text-align:left}
.quien:hover{background:var(--lado-hover)}
.quien small{display:block;font-size:12px;color:var(--lado-tenue)}
.btn-parquear{width:100%;justify-content:flex-start;background:var(--lado-activo);color:var(--blanco)}
.btn-parquear:hover{background:var(--lado-hover)}

.sala{min-width:0;padding-block:28px 72px;padding-left:clamp(16px,3vw,40px);padding-right:max(clamp(16px,3vw,40px),env(safe-area-inset-right,0px));outline:none}
.sala-in{max-width:1200px;margin-inline:auto;display:flex;flex-direction:column;gap:22px}

@media(max-width:900px){
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:31;background:var(--tinta)}
  .app{display:block}
  .lado{
    position:sticky;top:env(safe-area-inset-top,0px);height:auto;overflow:visible;z-index:30;
    display:grid;grid-template-columns:auto 1fr;align-items:center;gap:10px 12px;
    padding-block:12px 8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  }
  .lado-marca{padding-left:0}
  .lado-logo{width:118px}
  .lado-sub{display:none}
  .lado-pie{grid-column:2;grid-row:1;margin-top:0;flex-direction:row;justify-content:flex-end;align-items:center;gap:6px}
  .presentes,.quien small,.quien .quien-nombre,.btn-parquear span{display:none}
  .btn-parquear{width:auto;padding:8px 10px}
  .quien{padding:4px}
  .lado-nav{grid-column:1/-1;flex-direction:row;overflow-x:auto;scrollbar-width:none;gap:4px;margin-inline:-4px;padding-bottom:2px}
  .lado-nav::-webkit-scrollbar{display:none}
  .sala-link{flex:none;padding:8px 12px;font-size:14px;gap:8px}
  .sala-link svg{width:18px;height:18px}
  .cuenta{margin-left:4px}
  .sala{padding-top:20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
}

/* ---------- cabeceras de sala ---------- */
.sala-cab{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px 24px}
.sala-cab > div{display:flex;flex-direction:column;gap:10px;min-width:0}
.sala-cab h1{font-size:clamp(28px,3.6vw,42px);letter-spacing:-.03em}

/* ---------- bandas azules (Recepción y Reunión) ---------- */
.banda{
  position:relative;overflow:hidden;isolation:isolate;
  background:var(--degradado);color:var(--sobre-azul);border-radius:var(--r-l);
  padding:clamp(24px,3.4vw,40px);
  display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px 28px;align-items:end;
}
.banda::before{
  content:"";position:absolute;right:-70px;bottom:-90px;width:420px;height:420px;z-index:-1;
  background:url("img/mm-isotipo.png") no-repeat center/contain;
  opacity:.06;filter:brightness(0) invert(1);transform:rotate(-8deg);pointer-events:none;
}
.banda-txt{display:flex;flex-direction:column;gap:16px;min-width:0}
.banda-titulo{font-size:clamp(30px,4.3vw,52px);letter-spacing:-.035em;line-height:1}
.banda-titulo em{display:block;font-style:normal;color:var(--sobre-azul-acento)}
.banda-nota{color:var(--sobre-azul-suave);font-weight:300;font-size:16px;max-width:56ch}
.banda-acciones{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.mark{display:block;height:auto;pointer-events:none;user-select:none}
.mark-recepcion{width:clamp(120px,13vw,176px);margin-bottom:-8px}
.mark-reunion{width:clamp(150px,15vw,210px);margin-bottom:-10px}
@media(max-width:700px){.banda{grid-template-columns:1fr}.mark{display:none}}
@media(prefers-reduced-motion:no-preference){.mark-recepcion{animation:brinco 3.4s ease-in-out infinite}}
@keyframes brinco{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}

.reloj{display:inline-flex;align-items:center;gap:9px;background:var(--blanco);color:var(--tinta);border-radius:999px;padding:8px 15px 8px 12px;font-size:14px;font-weight:500;font-variant-numeric:tabular-nums;box-shadow:0 14px 34px -14px rgba(0,22,70,.55)}
.reloj svg{width:17px;height:17px;color:var(--azul-profundo)}
.punto{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--verde-abierto);flex:none;animation:latido 2.4s infinite}
@keyframes latido{0%{box-shadow:0 0 0 0 rgba(31,191,106,.5)}70%{box-shadow:0 0 0 9px rgba(31,191,106,0)}100%{box-shadow:0 0 0 0 rgba(31,191,106,0)}}
.quien-llego{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding-top:16px;border-top:1px solid var(--borde-claro)}
.quien-llego p{font-size:16px;font-weight:500}

/* ---------- botones ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 20px;border-radius:999px;border:1px solid transparent;font-size:15px;font-weight:600;cursor:pointer;text-decoration:none;white-space:nowrap;transition:background .15s ease,border-color .15s ease,box-shadow .15s ease,transform .15s ease}
.btn:hover{transform:translateY(-1px)}
.btn svg{width:18px;height:18px;flex:none}
.btn-sm{padding:8px 14px;font-size:14px}
.btn-primario{background:var(--azul-profundo);color:var(--blanco)}
.btn-primario:hover{background:var(--azul-hover);box-shadow:0 8px 24px -8px rgba(0,140,255,.45)}
.btn-blanco{background:var(--blanco);color:var(--azul-profundo)}
.btn-linea{background:var(--superficie);border-color:var(--linea);color:var(--tinta)}
.btn-linea:hover{border-color:var(--azul-brillante);color:var(--azul-profundo)}
.btn-linea-clara{background:transparent;border-color:var(--borde-claro);color:var(--sobre-azul)}
.btn-linea-clara:hover{background:var(--lado-activo)}
.btn-borrar{background:transparent;color:var(--alerta);border-color:transparent;padding-inline:10px}
.btn-borrar:hover{border-color:var(--alerta-tenue);background:var(--alerta-tenue)}
.armado,.armado:hover{background:var(--alerta);color:var(--blanco);border-color:var(--alerta)}
.icono-btn{width:38px;height:38px;flex:none;border-radius:50%;border:1px solid var(--linea);background:var(--superficie);display:grid;place-items:center;cursor:pointer;color:var(--tinta)}
.icono-btn:hover{border-color:var(--azul-brillante);color:var(--azul-profundo)}
.icono-btn svg{width:18px;height:18px}
.enlace{background:none;border:0;padding:0;color:var(--azul-profundo);font-weight:500;cursor:pointer;text-decoration:underline;text-underline-offset:3px;font-size:14px;text-align:left}
.enlace-suave{color:var(--tinta-suave)}
.mini-btn{width:28px;height:28px;border-radius:50%;border:1px solid var(--linea);background:var(--superficie);cursor:pointer;font-size:16px;line-height:1;display:grid;place-items:center}
.mini-btn:hover{border-color:var(--azul-brillante)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.btn:hover{transform:none}}

/* ---------- controles segmentados ---------- */
.seg{display:inline-flex;flex-wrap:wrap;background:var(--carril);border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:500;color:var(--tinta-suave);cursor:pointer;white-space:nowrap}
.seg button:hover{color:var(--tinta)}
.seg button[aria-pressed="true"]{background:var(--superficie);color:var(--tinta);box-shadow:0 1px 2px rgba(10,27,51,.14)}
.pestanas{align-self:flex-start}
.pestanas button{padding:9px 16px;font-size:14px}
.estado-seg button[aria-pressed="true"]{background:var(--azul-profundo);color:var(--blanco)}

/* ---------- chips y avatares ---------- */
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:500;line-height:1.45;white-space:nowrap}
.chip-etapa{background:var(--azul-tenue);color:var(--azul-profundo)}
.chip-neutro{background:var(--gris);color:var(--tinta-suave)}
.chip-alerta{background:var(--alerta-tenue);color:var(--alerta)}
.chip-curso,.chip-hoy{background:var(--azul-profundo);color:var(--blanco)}
.chip-vivo{background:var(--superficie);color:var(--tinta);border:1px solid var(--linea)}
.chip-blanco{background:var(--blanco);color:var(--azul-profundo)}
.avatar{width:28px;height:28px;border-radius:50%;display:inline-grid;place-items:center;flex:none;font-size:11px;font-weight:600;letter-spacing:.02em}
.av-simon{background:var(--azul-profundo);color:var(--blanco)}
.av-sebastian{background:var(--azul-tenue);color:var(--azul-profundo);box-shadow:inset 0 0 0 1px #C7DCF7}
.av-ambos{background:var(--gris-2);color:var(--tinta);font-size:10px}
.av-sin{background:var(--alerta-tenue);color:var(--alerta)}
.av-marca{background:var(--superficie);box-shadow:inset 0 0 0 1px var(--linea)}
.av-marca img{width:17px;height:auto}
.avatar-l{width:36px;height:36px;font-size:13px}

/* ---------- paneles ---------- */
.panel{background:var(--superficie);border:1px solid var(--linea);border-radius:var(--r-m);padding:22px;display:flex;flex-direction:column;gap:16px;min-width:0}
.panel-cab{display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;gap:12px}
.panel-cab > div:first-child{display:flex;flex-direction:column;gap:8px;min-width:0}
.panel-cab h2{font-size:22px}
.panel-herr{display:flex;flex-wrap:wrap;align-items:center;gap:8px}

.rejilla{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px;align-items:start}
.p-hoy{grid-column:span 7}
.p-norte{grid-column:span 5}
.p-rec,.p-ruta,.p-actividad{grid-column:span 4}
.p-parq{grid-column:span 7}
.p-reglas{grid-column:span 5}
@media(min-width:1181px){.p-reglas .reglas{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:1180px){.p-hoy,.p-norte,.p-reglas{grid-column:1/-1}.p-rec,.p-ruta,.p-actividad,.p-parq{grid-column:span 6}}
@media(max-width:720px){.rejilla > *{grid-column:1/-1!important}}

/* listas de tareas */
.lista-tareas{display:flex;flex-direction:column}
.fila{display:flex;align-items:flex-start;gap:12px;padding:12px 0;border-top:1px solid var(--linea)}
.fila:first-child{border-top:0;padding-top:2px}
.fila-txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.fila-titulo,.mini-titulo,.tarea-titulo,.obj-titulo,.rv-titulo{background:none;border:0;padding:0;text-align:left;cursor:pointer;color:var(--tinta);font-weight:500;font-size:15px;line-height:1.35}
.fila-titulo:hover,.mini-titulo:hover,.tarea-titulo:hover,.obj-titulo:hover,.rv-titulo:hover{color:var(--azul-profundo);text-decoration:underline;text-underline-offset:3px}
.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.es-hecha .fila-titulo,.es-hecha .mini-titulo,.es-hecha .tarea-titulo{color:var(--tinta-suave)}
.resultado{font-size:13px;color:var(--tinta-suave);font-weight:300;line-height:1.45}
.resultado b{font-weight:500;color:var(--tinta)}
.check{width:26px;height:26px;flex:none;border-radius:50%;border:2px solid var(--linea);background:var(--superficie);cursor:pointer;display:grid;place-items:center;color:transparent;padding:0;margin-top:-1px}
.check svg{width:15px;height:15px}
.check:hover{border-color:var(--azul-brillante);color:var(--azul-brillante)}
.check.on{background:var(--azul-profundo);border-color:var(--azul-profundo);color:var(--blanco)}
.mostrar-mas{align-self:flex-start}

/* norte y objetivos */
.norte{font-size:26px;letter-spacing:-.03em}
.objetivos{display:flex;flex-direction:column;gap:16px}
.objetivo{display:flex;flex-direction:column;gap:7px}
.obj-fila{display:flex;align-items:center;justify-content:space-between;gap:10px}
.obj-num{font-size:24px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.obj-num small{font-size:14px;font-weight:400;color:var(--tinta-suave);letter-spacing:0}
.obj-auto{font-size:12px;color:var(--tinta-suave)}
.obj-ctrl{display:flex;gap:6px}
.barra{height:8px;border-radius:99px;background:var(--gris-2);overflow:hidden}
.barra i{display:block;height:100%;border-radius:99px;background:var(--azul-brillante);transition:width .4s ease}

/* ruta vertical (Recepción) */
.ruta-v{display:flex;flex-direction:column;gap:0}
.rv{display:flex;gap:14px;position:relative;padding-bottom:16px}
.rv::before{content:"";position:absolute;left:14px;top:30px;bottom:0;width:2px;background:var(--gris-2)}
.rv:last-child{padding-bottom:0}
.rv:last-child::before{display:none}
.rv > div{display:flex;flex-direction:column;gap:2px;padding-top:4px;min-width:0}
.rv-meta{font-size:13px;color:var(--tinta-suave)}
.paso-num{width:30px;height:30px;border-radius:50%;background:var(--azul-brillante);color:var(--blanco);display:grid;place-items:center;font-weight:600;font-size:14px;flex:none;position:relative;z-index:1}
.paso-num svg{width:16px;height:16px}
.pendiente .paso-num{background:var(--gris-2);color:var(--tinta-suave)}
.cumplida .paso-num{background:var(--azul-profundo)}
.rv-final .paso-num{background:var(--tinta)}

/* actividad */
.actividad{display:flex;flex-direction:column;gap:12px}
.actividad li{display:flex;gap:10px;align-items:flex-start}
.actividad p{font-size:14px;line-height:1.4;min-width:0;overflow-wrap:anywhere}
.actividad b{font-weight:600}
.actividad time{display:block;font-size:12px;color:var(--tinta-suave);margin-top:2px}

/* parqueadero */
.form-linea{display:flex;gap:8px}
.form-linea input{flex:1;min-width:0}
.ideas{display:flex;flex-direction:column;gap:10px}
.idea{background:var(--fondo);border:1px solid var(--linea);border-radius:var(--r-s);padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.idea p{font-size:15px;overflow-wrap:anywhere}
.idea-pie{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 12px;font-size:12px;color:var(--tinta-suave)}
.idea-acc{display:flex;gap:14px}
.idea-acc .enlace{font-size:13px}

/* reglas */
.reglas{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}
.reglas li{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--tinta-suave);font-weight:300}
.reglas b{color:var(--tinta);font-weight:600;font-size:15px}
@media(max-width:900px){.reglas{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:520px){.reglas{grid-template-columns:1fr}}

/* ---------- campos ---------- */
.campo-input,.campo input,.campo select,.campo textarea,.form-linea input,.form-linea select,.filtro select,.select-suelto{
  width:100%;padding:10px 13px;border:1px solid var(--linea);border-radius:var(--r-s);background:var(--fondo);color:var(--tinta);font-size:15px;
}
.campo textarea{min-height:88px;resize:vertical;line-height:1.5}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--azul-brillante);box-shadow:var(--anillo)}
::placeholder{color:var(--tinta-tenue)}

/* ---------- tablero ---------- */
.ruta-h{display:grid;grid-template-columns:repeat(var(--n,5),minmax(150px,1fr)) minmax(120px,.6fr);gap:10px;overflow-x:auto;padding-bottom:4px}

// ---------- utilidades ----------
function $(s, el){ return (el || document).querySelector(s); }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function pad(n){ return String(n).padStart(2, '0'); }
var LS = {
  get: function(k, def){ try { var v = localStorage.getItem(k); return v == null ? def : JSON.parse(v); } catch(e){ return def; } },
  set: function(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
};
function opciones(lista, sel){
  return lista.map(function(o){ return '<option value="' + esc(o[0]) + '"' + (String(o[0]) === String(sel == null ? '' : sel) ? ' selected' : '') + '>' + esc(o[1]) + '</option>'; }).join('');
}
function ahora(){ return new Date().toISOString(); }
function nuevoId(){ return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function pesos(n){
  if (n === null || n === undefined || n === '' || isNaN(Number(n))) return '—';
  var v = Math.round(Number(n)), s = String(Math.abs(v)).replace(/\B(?=(\d{3})+(?!\d))/g, '.');
  return (v < 0 ? '−' : '') + '$' + s;
}
function leerPesos(s){ var d = String(s || '').replace(/[^\d]/g, ''); return d ? Number(d) : null; }
function porc(x){ return (x == null || !isFinite(x)) ? '—' : Math.round(x * 100) + '%'; }

// fechas (hora local de Medellín)
var MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
var MESES_C = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
var DIAS = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
var DIAS_C = ['dom','lun','mar','mié','jue','vie','sáb'];
function fechaISO(d){ return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function desdeISO(s){ var p = String(s).split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); }
function hoy(){ return fechaISO(new Date()); }
function sumarDias(s, n){ var d = desdeISO(s); d.setDate(d.getDate() + n); return fechaISO(d); }
function lunesDe(s){ var d = desdeISO(s); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return fechaISO(d); }
function fechaLarga(s){ var d = desdeISO(s); return DIAS[d.getDay()] + ' ' + d.getDate() + ' de ' + MESES[d.getMonth()]; }
function fechaCorta(s){ var d = desdeISO(s); return DIAS_C[d.getDay()] + ' ' + d.getDate() + ' ' + MESES_C[d.getMonth()]; }
function horaTexto(min){ var h = Math.floor(min / 60) % 24, m = min % 60; return (h % 12 === 0 ? 12 : h % 12) + ':' + pad(m) + (h < 12 ? ' a.m.' : ' p.m.'); }
function haceCuanto(iso){
  var t = Date.parse(iso); if (!t) return '';
  var min = Math.round((Date.now() - t) / 60000);
  if (min < 1) return 'ahora';
  if (min < 60) return 'hace ' + min + ' min';
  var d = new Date(t), hh = horaTexto(d.getHours() * 60 + d.getMinutes()), f = fechaISO(d);
  if (f === hoy()) return 'hoy, ' + hh;
  if (f === sumarDias(hoy(), -1)) return 'ayer, ' + hh;
  return fechaCorta(f) + ', ' + hh;
}
function saludoHora(){ var h = new Date().getHours(); return h < 12 ? 'Buenos días' : h < 19 ? 'Buenas tardes' : 'Buenas noches'; }

  presentes: [], tickClave:''
};
COLS.forEach(function(c){ S.d[c] = []; });
if (S.yo && !SOCIOS[S.yo]) S.yo = null;
function salaInicial(){ var h = (location.hash || '').slice(1); return SALA_IDS.indexOf(h) >= 0 ? h : 'recepcion'; }
function listo(){ return S.modo === 'local' || (S.modo === 'vivo' && COLS.every(function(c){ return S.recibidas[c]; })); }

// ---------- datos: base compartida (claude.ai) o copia local ----------
var B = { db:null, room:null, local:{} };

function iniciar(){
  render();
  var usar = window.claude && typeof window.claude.use === 'function';
  var p = usar ? window.claude.use('db').catch(function(){ return null; }) : Promise.resolve(null);
  p.then(function(db){
    if (db) { B.db = db; S.modo = 'vivo'; conectarVivo(db); }
    else { S.modo = 'local'; conectarLocal(); }
    render();
  });
  if (usar) conectarSala();
}

function conectarVivo(db){
  COLS.forEach(function(c){
    db.collection(c).onSnapshot(function(snap){
      S.d[c] = snap.docs.map(function(doc){ return Object.assign({id:doc.id}, doc.data()); });
      S.recibidas[c] = true;
      pedirRender();
    }, caida);
  });
  db.collection('actividad').orderBy('fecha', 'desc').limit(40).onSnapshot(function(snap){
    S.actividad = snap.docs.map(function(doc){ return Object.assign({id:doc.id}, doc.data()); });
    pedirRender();
  }, caida);
  // la actividad se guarda 60 días; lo más viejo se borra para no llenar la base
  var limite = new Date(Date.now() - 60 * 864e5).toISOString();
  db.collection('actividad').where('fecha', '<', limite).limit(100).get().then(function(snap){
    snap.docs.forEach(function(doc){ db.collection('actividad').doc(doc.id).delete().catch(function(){}); });
  }).catch(function(){});
}
function caida(err){
  S.error = err && err.code === 'revoked'
    ? 'Esta vista perdió el acceso a la oficina. Recarga la página.'
    : 'Se perdió la conexión con la oficina. Recarga la página para volver a ver los cambios en vivo.';
  pedirRender();
}
function conectarLocal(){
  COLS.concat('actividad').forEach(function(c){ B.local[c] = LS.get('mm-oficina-db:' + c, {}); });
  refrescarLocal();
}
function refrescarLocal(){
  function lista(c){ return Object.keys(B.local[c] || {}).map(function(id){ return Object.assign({id:id}, B.local[c][id]); }); }
  COLS.forEach(function(c){ S.d[c] = lista(c); });
  S.actividad = lista('actividad').sort(function(a, b){ return (b.fecha || '').localeCompare(a.fecha || ''); }).slice(0, 40);
  pedirRender();
}

function escribir(op, c, id, data){
  if (B.db) {
    var ref = B.db.collection(c).doc(id);
    var p = op === 'set' ? ref.set(data) : op === 'update' ? ref.update(data) : ref.delete();
    return p.then(function(){ return true; }, function(e){ avisar(mensajeError(e), 'alerta'); return false; });
  }
  if (S.modo !== 'local') { avisar('La oficina aún se está abriendo. Intenta de nuevo en un momento.', 'alerta'); return Promise.resolve(false); }
  var col = B.local[c] || (B.local[c] = {});
  if (op === 'set') col[id] = data;
  else if (op === 'update') col[id] = Object.assign({}, col[id] || {}, data);
  else delete col[id];
  LS.set('mm-oficina-db:' + c, col);
  refrescarLocal();
  return Promise.resolve(true);
}
function crear(c, data){ var id = nuevoId(); escribir('set', c, id, data); return id; }
function cambiar(c, id, patch){ return escribir('update', c, id, patch); }
function borrar(c, id){ return escribir('delete', c, id); }
function buscar(c, id){ return S.d[c].find(function(x){ return x.id === id; }); }
function guardarDoc(c, id, patch){ return buscar(c, id) ? cambiar(c, id, patch) : escribir('set', c, id, patch); }
function mensajeError(e){
  var c = e && e.code;
  if (c === 'quota_exceeded') return 'La oficina llegó a su límite de registros. Borren cosas que ya no sirvan para seguir creando.';
  if (c === 'resource_exhausted') return 'Muchos cambios seguidos. Espera unos segundos y vuelve a intentar.';
  if (c === 'revoked' || c === 'not_granted') return 'Esta vista ya no puede guardar en la oficina. Recarga la página.';
  return 'No se pudo guardar. Revisa la conexión y vuelve a intentar.';
}
function registrar(texto){ crear('actividad', {texto:texto, por:S.yo || '', fecha:ahora()}); }

// quién está en la oficina ahora mismo
function conectarSala(){
  window.claude.use('room').then(function(room){
    if (!room) return;
    B.room = room;
    anunciar();
    room.onPeers(function(ch){ S.presentes = ch.peers; renderLado(); }, function(){});
  }).catch(function(){});
}
function anunciar(){
  if (!B.room) return;
  B.room.presence({quien:S.yo || '', sala:S.sala, nota:S.sala === 'libreta' ? (S.notaSel || '') : ''}).catch(function(){});
}

// ---------- derivados ----------
function config(){ return buscar('config', 'oficina') || {}; }
function horaReunion(){ var h = config().horaReunion; return /^\d{1,2}:\d{2}$/.test(h || '') ? h : '18:00'; }
function minutosReunion(){ var p = horaReunion().split(':').map(Number); return p[0] * 60 + p[1]; }
function nombreReunion(){ var m = minutosReunion(), h = Math.floor(m / 60) % 12 || 12, mm = m % 60; return (h === 1 ? 'la 1' : 'las ' + h) + (mm ? ':' + pad(mm) : ''); }
function etapas(){ return S.d.etapas.slice().sort(function(a, b){ return (a.n || 0) - (b.n || 0); }); }
function etapa(id){ return id ? buscar('etapas', id) : null; }
function focoDe(f){ return buscar('semana', f); }
function textoFoco(fo){ if (!fo) return ''; var e = etapa(fo.etapa); return fo.foco || (e ? e.titulo : ''); }
function ordenTareas(a, b){ return (a.dia || '9999').localeCompare(b.dia || '9999') || (a.orden || 0) - (b.orden || 0); }
function ultimoAvance(t){ var a = t.avances || []; return a.length ? a[a.length - 1] : null; }
function textoAvance(a){ return '<p class="resultado"><b>Último avance · ' + (SOCIOS[a.por] ? SOCIOS[a.por].nombre + ', ' : '') + haceCuanto(a.fecha) + ':</b> ' + esc(a.texto) + (a.falta ? ' <b>Falta:</b> ' + esc(a.falta) : '') + '</p>'; }
function linkAvance(t){ return t.estado === 'hecho' ? '' : '<button class="enlace" data-accion="avance" data-id="' + esc(t.id) + '">Registrar avance</button>'; }
// plazos: «dia» es cuándo se trabaja la tarea; «plazo» es la fecha límite y activa los avisos
var AVISOS = [['3','3 días antes'],['7','7 días antes'],['14','14 días antes'],['30','30 días antes']];
function diasHasta(f){ return Math.round((desdeISO(f) - desdeISO(hoy())) / 864e5); }
function enAviso(t){ return t.estado !== 'hecho' && t.plazo && diasHasta(t.plazo) <= (Number(t.avisoDias) || 7); }
function textoPlazo(t){
  var d = diasHasta(t.plazo);
  if (d < 0) return 'Venció hace ' + (-d) + (d === -1 ? ' día' : ' días');
  if (d === 0) return 'Vence hoy';
  if (d === 1) return 'Vence mañana';
  return 'Vence en ' + d + ' días · ' + fechaCorta(t.plazo);
}
function chipPlazo(t){
  if (!t.plazo || t.estado === 'hecho') return '';
  var d = diasHasta(t.plazo);
  if (!enAviso(t)) return '<span class="chip chip-neutro">Plazo · ' + fechaCorta(t.plazo) + '</span>';
  return '<span class="chip ' + (d <= 1 ? 'chip-alerta' : 'chip-curso') + '">' + textoPlazo(t) + '</span>';
}
function esMia(t){ return !S.yo || !t.responsable || t.responsable === 'ambos' || t.responsable === S.yo; }
function plazosUrgentes(){ return S.d.tareas.filter(function(t){ return t.estado !== 'hecho' && t.plazo && diasHasta(t.plazo) <= 1; }); }
function horaActual(){ var n = new Date(); return pad(n.getHours()) + ':' + pad(n.getMinutes()); }
function esParaMi(r){ return !S.yo || !r.para || r.para === 'ambos' || r.para === S.yo; }
function recordatoriosVencidos(){
  var f = hoy(), hm = horaActual();
  return S.d.recordatorios.filter(function(r){ return !r.hecho && r.fecha && (r.fecha < f || (r.fecha === f && (!r.hora || r.hora <= hm))); });
}
function textoCuando(r){
  var f = hoy(), d = r.fecha < f ? 'Vencido · ' + fechaCorta(r.fecha) : r.fecha === f ? 'Hoy' : r.fecha === sumarDias(f, 1) ? 'Mañana' : fechaCorta(r.fecha);
  return d + (/^\d{2}:\d{2}$/.test(r.hora || '') ? ' · ' + horaTexto(Number(r.hora.slice(0, 2)) * 60 + Number(r.hora.slice(3, 5))) : '');
}
function tareasTxt(p){ return p.hechas + ' de ' + p.total + (p.total === 1 ? ' tarea' : ' tareas'); }
function progresoEtapa(id){
  var ts = S.d.tareas.filter(function(t){ return t.etapa === id; });
  return {total:ts.length, hechas:ts.filter(function(t){ return t.estado === 'hecho'; }).length, curso:ts.filter(function(t){ return t.estado === 'en_curso'; }).length};
}
function estadoEtapa(e, p){ if (e.cumplida) return 'cumplida'; if (p.hechas || p.curso) return 'en-curso'; return 'pendiente'; }
function estadoReunion(){
  var r = buscar('reuniones', hoy());
  var n = new Date(), min = n.getHours() * 60 + n.getMinutes(), ini = minutosReunion();
  if (r && r.fin) return {fase:'cerrada', r:r};
  if (r && r.inicio) return {fase:'curso', trans:Math.max(0, Math.floor((Date.now() - Date.parse(r.inicio)) / 60000)), r:r};
  if (min < ini) return {fase:'antes', faltan:ini - min};
  if (min < ini + 60) return {fase:'hora', trans:min - ini};
  return {fase:'paso'};
}
function bloqueActual(trans){ return BLOQUES.find(function(b){ return trans >= b.min && trans < b.min + b.dur; }) || null; }
function textoFaltan(m){ var h = Math.floor(m / 60), r = m % 60; return h ? h + ' h ' + r + ' min' : r + ' min'; }
function textoReloj(){
  var e = estadoReunion(), h = horaTexto(minutosReunion()), b;
  if (e.fase === 'antes') return ICON.reunion + 'Reunión de socios · ' + h + ' · faltan ' + textoFaltan(e.faltan);
  if (e.fase === 'hora') return '<i class="punto"></i>Es hora de la reunión · ' + h;
  if (e.fase === 'curso') { b = bloqueActual(e.trans); return '<i class="punto"></i>Reunión en curso · ' + (b ? b.titulo : 'tiempo extra'); }
  if (e.fase === 'cerrada') return ICON.check + 'Reunión de hoy cerrada · mañana ' + h;
  return ICON.reunion + 'Hoy no quedó acta de la reunión';
}
function claveReloj(){ var e = estadoReunion(), b = (e.fase === 'curso' || e.fase === 'hora') ? bloqueActual(e.trans) : null; return hoy() + '|' + e.fase + '|' + (b ? b.n : ''); }
function valorObjetivo(o){
  var actual = Number(o.actual) || 0, meta = (o.meta === null || o.meta === undefined || o.meta === '') ? null : Number(o.meta), dist;
  if (o.auto === 'firmados') actual = S.d.prospectos.filter(function(p){ return p.etapa === 'firmado'; }).length;
  if (o.auto === 'contactados') actual = S.d.prospectos.filter(function(p){ return p.etapa && p.etapa !== 'por_contactar'; }).length;
  if (o.auto === 'listas') { dist = S.d.proveedores.filter(function(p){ return p.tipo === 'Distribuidor'; }); actual = dist.filter(function(p){ return p.lista === 'recibida'; }).length; if (meta === null) meta = dist.length; }
  if (o.auto === 'ruta') { actual = S.d.etapas.filter(function(e){ return e.cumplida; }).length; if (meta === null) meta = S.d.etapas.length; }
  return {actual:actual, meta:meta};
}
var AUTO_TXT = {
  firmados:'Se cuenta solo: prospectos en «Firmado» (sala Comercial).',
  contactados:'Se cuenta solo: prospectos que ya pasaron de «Por contactar» (sala Comercial).',
  listas:'Se cuenta solo: distribuidores con la lista 2026 «Recibida» (sala Proveedores).',

};

// ---------- piezas comunes ----------
function avatar(r, mini){
  if (!r) return mini ? '<span class="avatar av-sin" title="Sin responsable">?</span>' : '<span class="chip chip-alerta">Sin responsable</span>';
  if (r === 'ambos') return '<span class="avatar av-ambos" title="Ambos socios">S+S</span>';
  var s = SOCIOS[r];
  return s ? '<span class="avatar av-' + r + '" title="' + esc(s.completo) + '">' + s.ini + '</span>' : '';
}
function avatarPor(por){ return SOCIOS[por] ? avatar(por) : '<span class="avatar av-marca" title="MinuteMark"><img src="img/mm-isotipo.png" alt=""></span>'; }
function chipEtapa(e){ return '<span class="chip chip-etapa">' + e.n + ' · ' + esc(e.titulo) + '</span>'; }
function botonCheck(t){
  var h = t.estado === 'hecho';
  return '<button class="check' + (h ? ' on' : '') + '" data-accion="' + (h ? 'reabrir' : 'completar') + '" data-id="' + esc(t.id) + '" title="' + (h ? 'Reabrir' : 'Marcar como hecha') + '" aria-label="' + (h ? 'Reabrir' : 'Marcar como hecha') + ': ' + esc(t.titulo) + '">' + ICON.check + '</button>';
}
function seg(grupo, lista, sel, clase){
  return '<div class="seg ' + (clase || '') + '" role="group">' + lista.map(function(o){
    return '<button type="button" data-accion="seg" data-grupo="' + esc(grupo) + '" data-valor="' + esc(o[0]) + '" aria-pressed="' + (String(o[0]) === String(sel)) + '">' + esc(o[1]) + '</button>';
  }).join('') + '</div>';
}
function cabecera(etq, titulo, lead, derecha){
  return '<header class="sala-cab"><div><span class="etiqueta">' + etq + '</span><h1>' + titulo + '</h1>' + (lead ? '<p class="lead">' + lead + '</p>' : '') + '</div>' + (derecha || '') + '</header>';
}
function filaTarea(t, extra){
  var e = etapa(t.etapa), hecha = t.estado === 'hecho', venc = !hecha && t.dia && t.dia < hoy(), ua = !hecha && ultimoAvance(t);
  var pasos = t.pasos || [], ok = pasos.filter(function(p){ return p.ok; }).length;
  return '<li class="fila' + (hecha ? ' es-hecha' : '') + '">' + botonCheck(t) +
    '<div class="fila-txt"><button class="fila-titulo" data-accion="editar-tarea" data-id="' + esc(t.id) + '">' + esc(t.titulo) + '</button>' +
    '<div class="meta">' + (e ? chipEtapa(e) : '') +
      (venc ? '<span class="chip chip-alerta">Atrasada · ' + fechaCorta(t.dia) + '</span>' : '') + chipPlazo(t) +
      (t.estado === 'en_curso' ? '<span class="chip chip-curso">En curso</span>' : '') +
      (pasos.length ? '<span class="chip chip-neutro">' + ok + '/' + pasos.length + ' pasos</span>' : '') + (extra || '') + '</div>' +
    (ua ? textoAvance(ua) : '') +
    (hecha && t.resultado ? '<p class="resultado"><b>Cómo se cumplió:</b> ' + esc(t.resultado) + '</p>' : '') +
    '</div>' + avatar(t.responsable, true) + '</li>';
}
function filaIdea(i){
  return '<li class="idea"><p>' + esc(i.texto) + '</p><div class="idea-pie"><span>' + (SOCIOS[i.por] ? SOCIOS[i.por].nombre + ' · ' : '') + haceCuanto(i.creada) + '</span>' +
    '<span class="idea-acc"><button class="enlace" data-accion="idea-a-ruta" data-id="' + esc(i.id) + '">Llevar a la ruta</button><button class="enlace enlace-suave" data-accion="idea-descartar" data-id="' + esc(i.id) + '">Descartar</button></span></div></li>';
}
function formParquear(id){

// los campos que se están escribiendo sobreviven a los cambios que llegan en vivo
function capturar(root){
  var a = document.activeElement, g = {foco:null, sel:null, valores:{}, scroll:{}};
  if (a && root.contains(a) && a.id) { g.foco = a.id; try { g.sel = [a.selectionStart, a.selectionEnd]; } catch(e){} }
  root.querySelectorAll('input[id],textarea[id],select[id]').forEach(function(el){
    if (el.type === 'checkbox' || el.type === 'radio') return;
    if (el.hasAttribute('data-vivo') && el.id !== g.foco) return;
    g.valores[el.id] = el.value;
  });
  root.querySelectorAll('[data-scroll][id]').forEach(function(el){ g.scroll[el.id] = [el.scrollLeft, el.scrollTop]; });
  return g;
}
function restaurar(root, g){
  Object.keys(g.valores).forEach(function(id){ var el = document.getElementById(id); if (el && root.contains(el) && el.value !== g.valores[id]) el.value = g.valores[id]; });
  Object.keys(g.scroll).forEach(function(id){ var el = document.getElementById(id); if (el) { el.scrollLeft = g.scroll[id][0]; el.scrollTop = g.scroll[id][1]; } });
  if (g.foco) { var f = document.getElementById(g.foco); if (f && root.contains(f)) { f.focus({preventScroll:true}); if (g.sel && g.sel[0] != null) try { f.setSelectionRange(g.sel[0], g.sel[1]); } catch(e){} } }
}

function desdeUltimaReunion(f){
  var prev = S.d.reuniones.filter(function(r){ return r.id < f && r.inicio; }).sort(function(a, b){ return b.id.localeCompare(a.id); })[0];
  if (prev) return prev.fin || prev.inicio;
  var d = desdeISO(sumarDias(f, -1)), m = minutosReunion(); d.setHours(Math.floor(m / 60), m % 60, 0, 0);
  return d.toISOString();
}
function vistaReunion(){

  var yaVistas = {}; avanzadas.forEach(function(t){ yaVistas[t.id] = true; });
  var abiertas = S.d.tareas.filter(function(t){ return t.estado !== 'hecho' && t.dia && t.dia <= f && !enFoco[t.id] && !yaVistas[t.id]; }).sort(ordenTareas);
  var decisiones = S.d.decisiones.filter(function(d){ return d.reunion === f; }).sort(function(a, b){ return (a.fecha || '').localeCompare(b.fecha || ''); });
  var compromisos = S.d.tareas.filter(function(t){ return t.origen === f; }).sort(ordenTareas);
  var ideas = ideasParqueadas();
  var fechas = S.d.reuniones.map(function(x){ return x.id; }).filter(function(x){ return x !== hoy(); }).sort().reverse();

  var botones = '';

  function bloque(b, contenido){

    '<div class="sub"><h3>Cumplido desde la última reunión · ' + cumplidas.length + '</h3>' +

    (avanzadas.length ? '<div class="sub"><h3>Avanzado, sin terminar · ' + avanzadas.length + '</h3><ul class="lista-tareas">' + avanzadas.map(function(t){
      return filaTarea(t, linkAvance(t) + (t.dia && t.dia <= f ? '<button class="enlace enlace-suave" data-accion="pasar-dia" data-id="' + esc(t.id) + '" data-dia="' + man + '">Pasar a ' + fechaCorta(man) + '</button>' : ''));

    '<div class="sub"><h3>Comprometido y abierto · ' + abiertas.length + '</h3>' +

    '<div class="sub"><label class="sr" for="reunion-notas">Notas del foco</label><textarea class="notas-reunion" id="reunion-notas" data-vivo data-guardar="reunion-notas" data-id="' + f + '" placeholder="Notas del foco: datos, cifras, lo que se habló. Lo que no sea del foco, al parqueadero.">' + esc(r.notas || '') + '</textarea></div>';

function modalQuien(){
  abrirForm({
    etiqueta:'Esta oficina', titulo:'¿Quién eres?', textoGuardar:'Listo', sinFoco:true,
    campos:[{id:'quien', label:'Socio', tipo:'segment', valor:S.yo || '', opciones:[['simon','Simón Ramírez'],['sebastian','Sebastián Ortiz']]},
      {tipo:'info', html:'<span>Se recuerda solo en este navegador. Sirve para saludarte, filtrar lo tuyo y firmar lo que haces en la oficina.</span>'}],
    validar: function(v){ if (!v.quien) return ['quien-0', 'Elige un nombre.']; },
    onGuardar: function(v){ ponerYo(v.quien); }
  });
}
function modalParquear(){
  abrirForm({
    etiqueta:'Parqueadero', titulo:'Parquear una idea', textoGuardar:'Parquear',
    campos:[{id:'texto', label:'La idea', tipo:'textarea', requerido:true, placeholder:'Escríbela y sigue con el foco. Se revisa en la revisión semanal.'}],
    onGuardar: function(v){ parquear(v.texto); }
  });
}
function parquear(texto){ crear('parqueadero', {texto:texto, por:S.yo || '', creada:ahora(), estado:'parqueada'}); registrar('parqueó una idea: «' + texto + '»'); avisar('Idea parqueada. Sigan con el foco.'); }
function ponerYo(q){ S.yo = SOCIOS[q] ? q : null; LS.set('mm-oficina-yo', S.yo); anunciar(); render(); }

// ---------- avisos ----------
var avisoT = null;
function avisar(texto, tipo){
  var a = $('#aviso');
  a.dataset.rec = '';
  a.className = 'aviso' + (tipo ? ' ' + tipo : '');
  a.textContent = texto;
  a.hidden = false;
  clearTimeout(avisoT); avisoT = setTimeout(function(){ a.hidden = true; }, 4200);
}
function celebrar(texto){
  var a = $('#aviso');
  a.dataset.rec = '';
  a.className = 'aviso logro';
  a.innerHTML = '<img src="img/mark-10-pulgar-arriba.webp" alt="" width="360" height="326"><span>' + esc(texto) + '</span>';
  a.hidden = false;
  clearTimeout(avisoT); avisoT = setTimeout(function(){ a.hidden = true; }, 3600);
}
function recordar(r){
  var a = $('#aviso');
  a.className = 'aviso recordar';
  a.dataset.rec = r.id;
  a.innerHTML = ICON.campana + '<span><b>Recordatorio' + (r.para && r.para !== 'ambos' && SOCIOS[r.para] ? ' para ' + SOCIOS[r.para].nombre : '') + ':</b> ' + esc(r.texto) + '</span><button class="btn btn-blanco btn-sm" data-accion="recordatorio-hecho" data-id="' + esc(r.id) + '">Hecho</button>';
  a.hidden = false;
  clearTimeout(avisoT); avisoT = setTimeout(function(){ a.hidden = true; }, 15000);
}
function revisarRecordatorios(){
  if (!listo()) return;
  var vistos = LS.get('mm-oficina-avisados', []);
  function nuevo(k){ if (vistos.indexOf(k) >= 0) return false; vistos.push(k); LS.set('mm-oficina-avisados', vistos.slice(-200)); return true; }
  var r = recordatoriosVencidos().filter(esParaMi).find(function(x){ return vistos.indexOf(x.id + '@' + x.fecha + x.hora) < 0; });
  if (r) { nuevo(r.id + '@' + r.fecha + r.hora); return recordar(r); }
  var t = plazosUrgentes().filter(esMia).find(function(x){ return vistos.indexOf(x.id + '@plazo@' + hoy()) < 0; });
  if (t) { nuevo(t.id + '@plazo@' + hoy()); recordarPlazo(t); }
}
function recordarPlazo(t){
  var a = $('#aviso');
  a.className = 'aviso recordar';
  a.dataset.rec = '';
  a.innerHTML = ICON.campana + '<span><b>' + textoPlazo(t) + ':</b> ' + esc(t.titulo) + '</span><button class="btn btn-blanco btn-sm" data-accion="editar-tarea" data-id="' + esc(t.id) + '">Ver</button>';
  a.hidden = false;
  clearTimeout(avisoT); avisoT = setTimeout(function(){ a.hidden = true; }, 15000);
}
function armado(el){
  if (el.dataset.armado === '1') return true;
  el.dataset.armado = '1'; el.dataset.txt = el.textContent; el.textContent = '¿Seguro? Toca otra vez'; el.classList.add('armado');
  setTimeout(function(){ if (el.isConnected && el.dataset.armado === '1') { el.dataset.armado = ''; el.textContent = el.dataset.txt; el.classList.remove('armado'); } }, 4000);
  return false;
}

// ---------- acciones ----------
function irA(s){
  if (SALA_IDS.indexOf(s) < 0) return;
  S.sala = s;
  try { history.replaceState(null, '', '#' + s); } catch(e){}
  anunciar(); render();
  window.scrollTo(0, 0);
}
function tarea(id){ return buscar('tareas', id); }
function moverTarea(id, estado){
  var t = tarea(id); if (!t || t.estado === estado) return;
  if (estado === 'hecho') return modalCompletar(t);
  cambiar('tareas', id, {estado:estado, hechaEn:''});
  if (estado === 'en_curso') registrar('empezó «' + t.titulo + '»');
  if (t.estado === 'hecho') registrar('reabrió «' + t.titulo + '»');
}
function moverProspecto(id, etapaNueva){
  var p = buscar('prospectos', id); if (!p || p.etapa === etapaNueva) return;
  cambiar('prospectos', id, {etapa:etapaNueva});
  registrar('pasó a ' + p.nombre + ' a «' + nombreEtapaCom(etapaNueva) + '»');
  if (etapaNueva === 'firmado') celebrar('Firmado. Primera venta.');
}

var ACC = {
  'ir': function(el){ irA(el.dataset.sala); },
  'soy': function(el){ ponerYo(el.dataset.quien); },
  'cambiar-quien': modalQuien,
  'parquear': modalParquear,
  'ajustes': modalAjustes,
  'nueva-tarea': function(el){ modalTarea(null, {dia:el.dataset.dia || '', estado:el.dataset.estado || '', etapa:el.dataset.etapa || (S.sala === 'tablero' && S.filtro.etapa !== 'todas' && S.filtro.etapa !== 'sin' ? S.filtro.etapa : '')}); },
  'editar-tarea': function(el){ var t = tarea(el.dataset.id); if (t) modalTarea(t); },
  'completar': function(el){ var t = tarea(el.dataset.id); if (t) modalCompletar(t); },
  'reabrir': function(el){ moverTarea(el.dataset.id, 'pendiente'); },
  'mover-tarea': function(el){ moverTarea(el.dataset.id, el.dataset.estado); },
  'avance': function(el){ var t = tarea(el.dataset.id); if (t) modalAvance(t); },
  'nuevo-recordatorio': function(){ modalRecordatorio(null); },
  'editar-recordatorio': function(el){ var r = buscar('recordatorios', el.dataset.id); if (r) modalRecordatorio(r); },
  'recordatorio-hecho': function(el){
    var r = buscar('recordatorios', el.dataset.id); if (!r) return;
    cambiar('recordatorios', r.id, {hecho:true, hechoEn:ahora()});
    var a = $('#aviso'); if (a.dataset.rec === r.id) a.hidden = true;
    avisar('Recordatorio hecho.');
  },
  'pasar-dia': function(el){ var t = tarea(el.dataset.id); if (!t) return; cambiar('tareas', t.id, {dia:el.dataset.dia}); registrar('pasó «' + t.titulo + '» al ' + fechaCorta(el.dataset.dia)); },
  'editar-foco': function(el){ modalFoco(el.dataset.fecha); },
  'ver-etapa': function(el){ S.filtro.etapa = el.dataset.id; LS.set('mm-oficina-filtro', S.filtro); irA('tablero'); },
  'filtrar-etapa': function(el){ S.filtro.etapa = S.filtro.etapa === el.dataset.id ? 'todas' : el.dataset.id; LS.set('mm-oficina-filtro', S.filtro); render(); },
  'editar-etapa': function(el){ var e = etapa(el.dataset.id); if (e) modalEtapa(e); },
  'nueva-etapa': function(){ modalEtapa(null); },
  'ver-hechas': function(){ S.verHechas = !S.verHechas; render(); },
  'ver-hechas-hoy': function(){ S.verHechasHoy = !S.verHechasHoy; render(); },
  'ver-perdidos': function(){ S.verPerdidos = !S.verPerdidos; render(); },
  'seg': function(el){
    var g = el.dataset.grupo, v = el.dataset.valor;
    if (g === 'hoy-mias') { S.hoyMias = v === '1'; LS.set('mm-oficina-mias', S.hoyMias); }
    else if (g === 'filtro-resp') { S.filtro.resp = v; LS.set('mm-oficina-filtro', S.filtro); }
    else if (g === 'prov-tab') { S.provTab = v; LS.set('mm-oficina-prov', v); }
    else if (g === 'com-resp') { S.comResp = v; }
    else if (g.indexOf('prov-lista:') === 0) {
      var p = buscar('proveedores', g.slice(11)); if (!p || (p.lista || 'por_pedir') === v) return;
      cambiar('proveedores', p.id, {lista:v, listaFecha:ahora(), actualizado:ahora()});
      if (v === 'recibida') registrar('recibió la lista 2026 de ' + p.nombre);
      if (v === 'pedida') registrar('pidió la lista 2026 a ' + p.nombre);
      return;
    }
    render();
  },
  'semana-mover': function(el){ var n = Number(el.dataset.n); S.semana = n ? sumarDias(S.semana || lunesDe(hoy()), n) : null; render(); },
  'ver-reunion': function(el){ S.reunionFecha = el.dataset.fecha === hoy() ? null : el.dataset.fecha; irA('reunion'); },
  'reunion-iniciar': function(){ var f = hoy(); guardarDoc('reuniones', f, {fecha:f, inicio:ahora(), fin:''}); registrar('inició la reunión de ' + nombreReunion()); },
  'reunion-cerrar': function(el){
    var f = el.dataset.fecha, man = sumarDias(f, 1);
    if (!textoFoco(focoDe(man))) { avisar('Antes de cerrar, definan el foco de mañana.'); return modalFoco(man); }
    var nd = S.d.decisiones.filter(function(d){ return d.reunion === f; }).length, nc = S.d.tareas.filter(function(t){ return t.origen === f; }).length;
    cambiar('reuniones', f, {fin:ahora()});
    registrar('cerró la reunión con ' + nd + (nd === 1 ? ' decisión' : ' decisiones') + ' y ' + nc + (nc === 1 ? ' compromiso' : ' compromisos'));
    celebrar('Reunión cerrada. Mañana: ' + textoFoco(focoDe(man)) + '.');
  },
  'reunion-reabrir': function(el){ cambiar('reuniones', el.dataset.fecha, {fin:''}); },
  'borrar-decision': function(el){ if (armado(el)) borrar('decisiones', el.dataset.id); },
  'idea-a-ruta': function(el){ var i = buscar('parqueadero', el.dataset.id); if (i) modalTarea(null, {titulo:i.texto, idea:i.id}); },
  'idea-descartar': function(el){ if (armado(el)) cambiar('parqueadero', el.dataset.id, {estado:'descartada'}); },
  'nuevo-objetivo': function(){ modalObjetivo(null); },
  'editar-objetivo': function(el){ var o = buscar('objetivos', el.dataset.id); if (o) modalObjetivo(o); },
  'obj-sumar': function(el){ var o = buscar('objetivos', el.dataset.id); if (o) cambiar('objetivos', o.id, {actual:Math.max(0, (Number(o.actual) || 0) + Number(el.dataset.n))}); },
  'nuevo-proveedor': function(){ modalProveedor(null); },
  'editar-proveedor': function(el){ var p = buscar('proveedores', el.dataset.id); if (p) modalProveedor(p); },
  'nueva-cotizacion': function(){ modalCotizacion(null); },
  'editar-cotizacion': function(el){ var c = buscar('cotizaciones', el.dataset.id); if (c) modalCotizacion(c); },
  'nuevo-producto': function(){ modalProducto(null); },
  'editar-producto': function(el){ var p = buscar('productos', el.dataset.id); if (p) modalProducto(p); },
  'nuevo-prospecto': function(){ modalProspecto(null); },
  'editar-prospecto': function(el){ var p = buscar('prospectos', el.dataset.id); if (p) modalProspecto(p); },
  'registrar-contacto': function(el){ var p = buscar('prospectos', el.dataset.id); if (p) modalContacto(p); },
  'avanzar-prospecto': function(el){
    var p = buscar('prospectos', el.dataset.id); if (!p) return;
    var i = ETAPAS_COM.findIndex(function(e){ return e[0] === (p.etapa || 'por_contactar'); });
    if (i >= 0 && i < ETAPAS_COM.length - 1) moverProspecto(p.id, ETAPAS_COM[i + 1][0]);
  },
  'nota-sel': function(el){ S.notaSel = el.dataset.id; LS.set('mm-oficina-nota', S.notaSel); anunciar(); render(); },
  'nueva-nota': function(){ var id = crear('libreta', {titulo:'Nota nueva', texto:'', orden:50, editada:ahora(), editadaPor:S.yo || ''}); S.notaSel = id; LS.set('mm-oficina-nota', id); anunciar(); setTimeout(function(){ var t = $('#nota-titulo'); if (t) { t.focus(); t.select(); } }, 60); },
  'borrar-nota': function(el){ if (armado(el)) { borrar('libreta', el.dataset.id); S.notaSel = null; } },
  'cerrar-modal': cerrarModal,
  'borrar-modal': function(el){ if (M && M.cfg.onBorrar && armado(el)) { M.cfg.onBorrar(); cerrarModal(); } },
  'paso-agregar': function(){ var i = $('#m-paso-nuevo'); if (!i || !M || !i.value.trim()) return; M.pasos.push({t:i.value.trim(), ok:false}); i.value = ''; $('#m-pasos-lista').innerHTML = pasosHTML(); i.focus(); },
  'paso-quitar': function(el){ if (!M) return; M.pasos.splice(Number(el.dataset.i), 1); $('#m-pasos-lista').innerHTML = pasosHTML(); }
};
var CAMBIO = {
  'filtro-etapa': function(el){ S.filtro.etapa = el.value; LS.set('mm-oficina-filtro', S.filtro); render(); },
  'programar': function(el){ var t = tarea(el.dataset.id); if (t && el.value) { cambiar('tareas', t.id, {dia:el.value}); } },
  'reunion-fecha': function(el){ S.reunionFecha = el.value === hoy() ? null : el.value; render(); },
  'com-canal': function(el){ S.comCanal = el.value; render(); },
  'paso-ok': function(el){ if (M && M.pasos[Number(el.dataset.i)]) M.pasos[Number(el.dataset.i)].ok = el.checked; }
};
var FORM = {
  'modal': enviarModal,
  'parquear': function(f){ var i = f.querySelector('input'), t = i.value.trim(); if (!t) return i.focus(); i.value = ''; parquear(t); },
  'decision': function(f){
    var i = f.querySelector('input'), t = i.value.trim(); if (!t) return i.focus();
    i.value = '';
    crear('decisiones', {texto:t, reunion:f.dataset.fecha, fecha:ahora(), por:S.yo || ''});
    registrar('dejó una decisión: «' + t + '»');
  },
  'compromiso': function(f){
    var el = f.elements, titulo = el.titulo.value.trim(), resp = el.responsable.value, dia = el.dia.value;
    if (!titulo) return el.titulo.focus();
    if (!resp) { avisar('Cada compromiso necesita responsable.', 'alerta'); return el.responsable.focus(); }
    if (!dia) { avisar('Cada compromiso necesita día.', 'alerta'); return el.dia.focus(); }
    var fo = focoDe(dia);
    crear('tareas', {titulo:titulo, responsable:resp, dia:dia, etapa:fo && fo.etapa || '', estado:'pendiente', pasos:[], nota:'', resultado:'', origen:f.dataset.fecha, creada:ahora(), creadaPor:S.yo || '', orden:Date.now()});
    registrar('se comprometió con «' + titulo + '» · ' + (resp === 'ambos' ? 'ambos' : SOCIOS[resp].nombre) + (dia ? ', ' + fechaCorta(dia) : ''));
    el.titulo.value = ''; el.responsable.value = '';
    el.titulo.focus();
  }
};

document.addEventListener('click', function(e){
  var el = e.target.closest('[data-accion]');
  if (!el) return;
  var fn = ACC[el.dataset.accion];
  if (fn) { e.preventDefault(); fn(el, e); }
});
document.addEventListener('change', function(e){ var el = e.target.closest('[data-cambio]'); if (el && CAMBIO[el.dataset.cambio]) CAMBIO[el.dataset.cambio](el, e); });
document.addEventListener('submit', function(e){ var f = e.target; if (f.dataset && FORM[f.dataset.form]) { e.preventDefault(); FORM[f.dataset.form](f, e); } });
document.addEventListener('input', function(e){
  var el = e.target;
  if (el.dataset && el.dataset.guardar) programarGuardado(el);
  if (el.classList && el.classList.contains('paso-texto') && M && M.pasos[Number(el.dataset.i)]) M.pasos[Number(el.dataset.i)].t = el.value;
});
document.addEventListener('focusout', function(e){ var el = e.target; if (el.dataset && el.dataset.guardar) guardarYa(el); });
document.addEventListener('keydown', function(e){
  if (e.key === 'Enter' && e.target.id === 'm-paso-nuevo') { e.preventDefault(); ACC['paso-agregar'](); }
});
$('#modal').addEventListener('click', function(e){ if (e.target === this) cerrarModal(); });
$('#modal').addEventListener('close', function(){ M = null; });

// arrastrar tareas y prospectos entre columnas (escritorio)
document.addEventListener('dragstart', function(e){
  var c = e.target.closest && e.target.closest('[data-arrastre]'); if (!c) return;
  e.dataTransfer.setData('text/plain', c.dataset.arrastre); e.dataTransfer.effectAllowed = 'move'; c.classList.add('arrastrando');
});
document.addEventListener('dragend', function(){ document.querySelectorAll('.arrastrando,.sobre').forEach(function(x){ x.classList.remove('arrastrando', 'sobre'); }); });
document.addEventListener('dragover', function(e){ var col = e.target.closest && e.target.closest('[data-columna]'); if (!col) return; e.preventDefault(); col.classList.add('sobre'); });
document.addEventListener('dragleave', function(e){ var col = e.target.closest && e.target.closest('[data-columna]'); if (col && !col.contains(e.relatedTarget)) col.classList.remove('sobre'); });
document.addEventListener('drop', function(e){
  var col = e.target.closest && e.target.closest('[data-columna]'); if (!col) return;
  e.preventDefault(); col.classList.remove('sobre');
  var d = (e.dataTransfer.getData('text/plain') || '').split(':'), c = col.dataset.columna.split(':');
  if (d[0] !== c[0]) return;
  if (d[0] === 't') moverTarea(d.slice(1).join(':'), c[1]);
  if (d[0] === 'p') moverProspecto(d.slice(1).join(':'), c[1]);
});

// textos que se guardan solos (notas de la reunión y libreta)
var guardados = {};
function programarGuardado(el){ clearTimeout(guardados[el.id]); guardados[el.id] = setTimeout(function(){ guardarYa(el); }, 800); }
function guardarYa(el){
  clearTimeout(guardados[el.id]); delete guardados[el.id];
  var v = el.value, k = el.dataset.guardar, id = el.dataset.id, cur;
  if (k === 'reunion-notas') { cur = buscar('reuniones', id); if ((cur && cur.notas || '') === v) return; guardarDoc('reuniones', id, {fecha:id, notas:v}); }
  if (k === 'nota-texto') { cur = buscar('libreta', id); if (!cur || (cur.texto || '') === v) return; cambiar('libreta', id, {texto:v, editada:ahora(), editadaPor:S.yo || ''}); }
  if (k === 'nota-titulo') { cur = buscar('libreta', id); if (!cur || (cur.titulo || '') === v.trim() || !v.trim()) return; cambiar('libreta', id, {titulo:v.trim(), editada:ahora(), editadaPor:S.yo || ''}); }
}

// el reloj de la reunión avanza solo
setInterval(function(){
  if (!listo()) return;
  document.querySelectorAll('[data-reloj]').forEach(function(el){ el.innerHTML = textoReloj(); });
  var k = claveReloj();
  if (k !== S.tickClave) { S.tickClave = k; pedirRender(); }
  revisarRecordatorios();
  renderLado();
}, 20000);

iniciar();
})();
</script>
